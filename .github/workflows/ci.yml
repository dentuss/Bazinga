name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (.NET build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bazinga.api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore BazingaComics.sln
      - name: Build
        run: dotnet build BazingaComics.sln -c Release --no-restore
      - name: Test
        run: dotnet test BazingaComics.sln -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bazinga.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bazinga.client/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
